server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/project_sunrise?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:project-sunrise-secret-key-that-is-at-least-32-bytes-long-for-hs256-algorithm}
  access-token-expiration: 3600000  # 1 hour
  refresh-token-expiration: 604800000  # 7 days

# Password Reset
password-reset:
  token-expiration: 3600000  # 1 hour

# Google OAuth2
spring.security.oauth2.client:
  registration:
    google:
      client-id: ${GOOGLE_CLIENT_ID:120432098406-cut7k56sn906mcpakjlbkkvsf6sqj7c5.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET: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}
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      scope:
        - email
        - profile
  provider:
    google:
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      user-name-attribute: sub
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

# Razorpay
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_demo}
  key-secret: ${RAZORPAY_KEY_SECRET:demo_secret}

# Frontend
frontend:
  url: ${FRONTEND_URL:http://localhost:5174}

# File Upload
upload:
  dir: ${UPLOAD_DIR:./uploads}
  allowed-types: image/jpeg,image/png,image/gif,application/pdf
  max-size: 10485760  # 10MB

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# Swagger / OpenAPI — disabled by default, enabled in dev profile
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
